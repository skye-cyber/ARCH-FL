extends: "../base.yaml"

data:
  dataset: "PneumoniaMNIST"
  iid: false
  partition_type: "dirichlet"
  dirichlet_alpha: 0.3
  num_clients: 20

model:
  architecture: "SimpleCNN"

training:
  local_epochs: 2
  batch_size: 64
  learning_rate: 0.02
  client_fraction: 0.3

privacy:
  enabled: true
  epsilon: [1.0, 2.0, 4.0, 8.0]
  delta: 1e-5
  max_grad_norm: 1.5
