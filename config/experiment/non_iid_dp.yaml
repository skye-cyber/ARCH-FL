extends: "../base.yaml"

data:
  dataset: "PneumoniaMNIST"
  iid: false
  partition_type: "dirichlet"
  dirichlet_alpha: 0.5
  num_clients: 10

model:
  architecture: "SimpleCNN"
  input_channels: 1
  num_classes: 2

training:
  local_epochs: 1
  batch_size: 32
  learning_rate: 0.01
  client_fraction: 0.5

privacy:
  enabled: true
  epsilon: 2.0
  delta: 1e-5
  max_grad_norm: 1.0
